name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typprüfung (tsc, JSDoc)
        run: npm run typecheck

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Browser-Tests (Playwright)
        run: npm run test:e2e

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
