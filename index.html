<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="" data-i18n-attr="content:ui.metaDescription">
  <meta name="theme-color" content="#4f46e5">
  <title></title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234f46e5'/%3E%3Cg%20fill='%23fff'%20opacity='.32'%3E%3Crect%20x='13.3'%20y='5.5'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='21.1'%20y='5.5'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='5.5'%20y='13.3'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='13.3'%20y='13.3'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='5.5'%20y='21.1'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='21.1'%20y='21.1'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3C/g%3E%3Cg%20fill='%23fff'%3E%3Crect%20x='5.5'%20y='5.5'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='21.1'%20y='13.3'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3Crect%20x='13.3'%20y='21.1'%20width='5.6'%20height='5.6'%20rx='1.5'/%3E%3C/g%3E%3Cpath%20d='M8.3%2011.1C8.3%2012.2%2023.9%2012.2%2023.9%2013.3M23.9%2018.9C23.9%2020%2016.1%2020%2016.1%2021.1'%20fill='none'%20stroke='%23fb923c'%20stroke-width='1.6'%20stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="./js/ui/main.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <button type="button" class="logo-btn" id="logoBtn" aria-haspopup="true" aria-expanded="false" aria-controls="startMenu" data-i18n-attr="title:ui.startTitle;aria-label:ui.startTitle">
      </button>
      <nav class="app-tabs" id="appTabs" role="tablist" data-i18n-attr="aria-label:tabs.label"></nav>
    </div>

    <div class="toolbar">
      <div class="segmented" id="modeSwitch" role="group" data-i18n-attr="aria-label:ui.mode"></div>

      <div class="btn-group" id="historyButtons"></div>

      <div class="menu">
        <button type="button" class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menuList">
          <span data-i18n="ui.menu.file"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu-list" id="menuList" role="menu" hidden>
          <button type="button" role="menuitem" data-action="new" data-i18n="ui.menu.new"></button>
          <button type="button" role="menuitem" data-action="open" data-i18n="ui.menu.open"></button>
          <button type="button" role="menuitem" data-action="example" data-i18n="ui.menu.examples"></button>
          <hr>
          <button type="button" role="menuitem" data-action="settings" data-i18n="ui.menu.settings"></button>
          <button type="button" role="menuitem" data-action="constraints" data-i18n="ui.menu.constraints"></button>
          <hr>
          <button type="button" role="menuitem" data-action="export-json" data-i18n="ui.menu.exportJson"></button>
          <button type="button" role="menuitem" data-action="import-json" data-i18n="ui.menu.importJson"></button>
          <hr>
          <button type="button" role="menuitem" data-action="export" class="menu-strong"><span data-i18n="ui.menu.export"></span><span class="menu-hint" data-i18n="ui.menu.exportHint"></span></button>
          <button type="button" role="menuitem" data-action="share" data-i18n="ui.menu.share"></button>
          <hr>
          <div class="menu-label" data-i18n="ui.menu.language"></div>
          <!-- Sprachnamen bleiben in der jeweiligen Sprache -->
          <button type="button" role="menuitemradio" data-lang="de" lang="de">Deutsch</button>
          <button type="button" role="menuitemradio" data-lang="en" lang="en">English</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="matrix-section" aria-labelledby="matrixHeading">
      <h2 id="matrixHeading" class="visually-hidden" data-i18n="ui.matrixHeading"></h2>
      <textarea id="description" class="description" rows="1" data-i18n-attr="placeholder:ui.descriptionPlaceholder;aria-label:ui.description"></textarea>

      <div class="stats" id="stats" aria-live="polite"></div>

      <div class="matrix-search" role="search">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input type="search" id="matrixSearch" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:ui.searchPlaceholder;aria-label:ui.searchLabel;title:ui.searchTitle">
        </label>
        <span class="search-count" id="searchCount" aria-live="polite"></span>
        <button type="button" class="icon-btn small" id="searchPrev" data-i18n-attr="title:ui.searchPrev;aria-label:ui.searchPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        <button type="button" class="icon-btn small" id="searchNext" data-i18n-attr="title:ui.searchNext;aria-label:ui.searchNext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>

      <nav class="cat-nav" id="catNav" data-i18n-attr="aria-label:ui.categories" hidden></nav>

      <div class="matrix-scroll" id="matrixScroll">
        <div class="matrix-wrap" id="matrixWrap">
          <svg id="lines" class="lines" aria-hidden="true"></svg>
          <div class="matrix" id="matrix"></div>
        </div>
      </div>

      <div class="below-matrix" id="belowMatrix"></div>
    </section>

    <aside class="panel concepts-panel" aria-labelledby="conceptsHeading">
      <div class="panel-head">
        <h2 id="conceptsHeading" data-i18n="ui.conceptsHeading"></h2>
        <button type="button" class="btn btn-small btn-primary" id="addConceptBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="ui.addConcept"></span>
        </button>
      </div>
      <ul class="concept-list" id="conceptList"></ul>
      <div class="concept-actions">
        <button type="button" class="btn btn-small" id="randomBtn" data-i18n-attr="title:ui.randomTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" class="fill"/><circle cx="15" cy="15" r="1.2" class="fill"/><circle cx="15" cy="9" r="1.2" class="fill"/><circle cx="9" cy="15" r="1.2" class="fill"/></svg>
          <span data-i18n="ui.random"></span>
        </button>
        <button type="button" class="btn btn-small" id="clearSelBtn" data-i18n="ui.clearSelection"></button>
      </div>
      <div class="auto-concepts" id="autoConcepts" hidden></div>
      <div class="line-mode">
        <span id="lineModeLabel" data-i18n="ui.lines"></span>
        <div class="segmented" id="lineModeButtons" role="group" aria-labelledby="lineModeLabel"></div>
      </div>
      <div class="summary" id="conceptSummary"></div>
    </aside>

    <section class="panel compare-section" id="compareSection" aria-labelledby="compareTitle"></section>
  </main>

  <dialog class="dialog" id="libraryDialog" aria-labelledby="libraryHeading">
    <div class="dialog-head">
      <h2 id="libraryHeading" data-i18n="ui.libraryHeading"></h2>
      <button type="button" class="icon-btn" id="libraryClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="dialog-hint" data-i18n="ui.libraryHint"></p>
    <div class="library-actions">
      <button type="button" class="btn btn-small" id="backupExportBtn" data-i18n-attr="title:ui.backupExportTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span data-i18n="ui.backupExport"></span>
      </button>
      <button type="button" class="btn btn-small" id="backupRestoreBtn" data-i18n-attr="title:ui.backupRestoreTitle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
        <span data-i18n="ui.backupRestore"></span>
      </button>
      <input type="file" id="backupFile" accept=".zip,application/zip,.json,application/json" multiple hidden>
    </div>
    <ul class="doc-list" id="docList"></ul>
  </dialog>

  <dialog class="dialog" id="examplesDialog" aria-labelledby="examplesHeading">
    <div class="dialog-head">
      <h2 id="examplesHeading" data-i18n="ui.examplesHeading"></h2>
      <button type="button" class="icon-btn" id="examplesClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="dialog-hint" data-i18n="ui.examplesHint"></p>
    <ul class="doc-list" id="exampleList"></ul>
  </dialog>

  <dialog class="dialog" id="settingsDialog" aria-labelledby="settingsHeading">
    <div class="dialog-head">
      <h2 id="settingsHeading" data-i18n="ui.settingsHeading"></h2>
      <button type="button" class="icon-btn" id="settingsClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="dialog-hint" data-i18n="ui.settingsHint"></p>
    <div id="settingsBody"></div>

    <div class="dialog-foot">
      <button type="button" class="btn btn-primary" id="settingsDone" data-i18n="ui.done"></button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="menu-list start-menu" id="startMenu" role="menu" data-i18n-attr="aria-label:ui.startTitle" hidden></div>
  <div class="menu-list tab-menu" id="tabMenu" role="menu" data-i18n-attr="aria-label:tabs.add" hidden></div>
  <div class="note-pop" id="notePop" role="tooltip" hidden></div>
  <dialog class="dialog score-dialog" id="scoreDialog" aria-labelledby="scoreHeading">
    <div class="dialog-head">
      <h2 id="scoreHeading" data-i18n="ui.scoreHeading"></h2>
      <button type="button" class="icon-btn" id="scoreClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="scoreBody"></div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-primary" id="scoreDone" data-i18n="ui.done"></button>
    </div>
  </dialog>

  <dialog class="dialog export-dialog" id="exportDialog" aria-labelledby="exportHeading">
    <div class="dialog-head">
      <h2 id="exportHeading" data-i18n="ui.exportHeading"></h2>
      <button type="button" class="icon-btn" id="exportClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="exportBody"></div>
  </dialog>

  <dialog class="dialog help-dialog" id="helpDialog" aria-labelledby="helpHeading">
    <div class="dialog-head">
      <div class="help-title">
        <span class="help-logo" id="helpLogo" aria-hidden="true"></span>
        <div>
          <h2 id="helpHeading" data-i18n="ui.appName"></h2>
          <p class="help-sub" data-i18n="ui.appTagline"></p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="helpClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="help-tabs" role="tablist" data-i18n-attr="aria-label:ui.helpTabs">
      <button type="button" role="tab" id="helpTabStart" aria-controls="helpStart" data-help-tab="start" data-i18n="ui.helpTabStart"></button>
      <button type="button" role="tab" id="helpTabKeys" aria-controls="helpKeys" data-help-tab="keys" data-i18n="ui.helpTabKeys"></button>
      <button type="button" role="tab" id="helpTabAbout" aria-controls="helpAbout" data-help-tab="about" data-i18n="ui.helpTabAbout"></button>
    </div>
    <div class="help-panel" id="helpStart" role="tabpanel" aria-labelledby="helpTabStart"></div>
    <div class="help-panel" id="helpKeys" role="tabpanel" aria-labelledby="helpTabKeys" hidden></div>
    <div class="help-panel" id="helpAbout" role="tabpanel" aria-labelledby="helpTabAbout" hidden></div>
    <div class="dialog-foot help-foot">
      <span class="help-meta" id="helpMeta"></span>
      <button type="button" class="btn btn-primary" id="helpDone" data-i18n="ui.close"></button>
    </div>
  </dialog>

  <div class="cons-pop" id="consPop" role="dialog" aria-labelledby="consPopTitle" hidden></div>
  <div class="status-pop" id="statusPop" role="dialog" aria-labelledby="statusPopTitle" hidden></div>
  <div class="score-pop" id="scorePop" role="dialog" aria-labelledby="scorePopTitle" hidden></div>

  <dialog class="dialog cons-dialog" id="consDialog" aria-labelledby="consHeading">
    <div class="dialog-head">
      <h2 id="consHeading" data-i18n="ui.constraintsHeading"></h2>
      <button type="button" class="icon-btn" id="consClose" data-i18n-attr="aria-label:ui.close;title:ui.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="dialog-hint" data-i18n="ui.constraintsHint"></p>
    <div class="cons-legend">
      <span><span class="cons-key ok"></span><span data-i18n="ui.constraintsLegendOk"></span></span>
      <span><span class="cons-key conditional">!</span><span data-i18n="ui.constraintsLegendConditional"></span></span>
      <span><span class="cons-key excluded">✕</span><span data-i18n="ui.constraintsLegendExcluded"></span></span>
      <span class="cons-summary" id="consSummary" aria-live="polite"></span>
    </div>
    <div class="cons-body" id="consBody"></div>
    <div class="dialog-foot cons-foot">
      <span class="cons-tip" data-i18n="ui.constraintsTip"></span>
      <button type="button" class="btn btn-primary" id="consDone" data-i18n="ui.done"></button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
